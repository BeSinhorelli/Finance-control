<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transações - FinanceApp</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 12px 24px;
            border-radius: 10px;
            color: white;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .toast.show { opacity: 1; }
        .toast.success { background: #27ae60; }
        .toast.error { background: #e74c3c; }
        .category-badge { background: #e8f0fe; padding: 4px 10px; border-radius: 20px; font-size: 12px; }
        .type-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; }
        .type-badge.income { background: #d4edda; color: #155724; }
        .type-badge.expense { background: #f8d7da; color: #721c24; }
        .income-value { color: #27ae60; font-weight: bold; }
        .expense-value { color: #e74c3c; font-weight: bold; }
        .btn-icon { padding: 6px 10px; margin: 0 3px; border: none; border-radius: 6px; cursor: pointer; }
        .btn-icon.edit { background: #3498db; color: white; }
        .btn-icon.delete { background: #e74c3c; color: white; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo-small">
                <span>💰</span>
                <h1>FinanceApp</h1>
            </div>
            <div class="nav-menu">
                <a href="dashboard.html">📊 Dashboard</a>
                <a href="transactions.html" class="active">📝 Transações</a>
                <div class="user-info">
                    <span>👤 <span id="userName"></span></span>
                    <button id="logoutBtn" class="btn-logout">🚪 Sair</button>
                </div>
            </div>
        </div>
    </nav>
    
    <div class="container">
        <div class="transactions-header">
            <h2>📝 Minhas transações</h2>
            <button onclick="openModal()" class="btn-primary">➕ Nova transação</button>
        </div>
        
        <div class="filters-card">
            <div class="filter-row">
                <div class="date-filters">
                    <label>📅 De:</label>
                    <input type="date" id="startDate">
                    <label>Até:</label>
                    <input type="date" id="endDate">
                </div>
                <div class="filter-actions">
                    <button onclick="loadTransactions()" class="btn-secondary">🔍 Filtrar</button>
                    <button onclick="resetFilters()" class="btn-outline">🔄 Limpar</button>
                </div>
            </div>
        </div>
        
        <div class="transactions-table-container">
            <table class="transactions-table">
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Descrição</th>
                        <th>Categoria</th>
                        <th>Tipo</th>
                        <th>Valor</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="transactionsList">
                    <tr><td colspan="6" class="empty-message">📭 Carregando...</td</tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <!-- Modal -->
    <div id="transactionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">➕ Nova transação</h3>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <form id="transactionForm">
                <input type="hidden" id="transactionId">
                
                <div class="form-group">
                    <label>📝 Descrição</label>
                    <input type="text" id="description" placeholder="Ex: Supermercado, Salário" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>💰 Valor</label>
                        <input type="number" id="amount" step="0.01" placeholder="0,00" required>
                    </div>
                    <div class="form-group">
                        <label>📅 Data</label>
                        <input type="date" id="transactionDate" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>🔄 Tipo</label>
                        <select id="type" required onchange="updateCategories()">
                            <option value="EXPENSE">💸 Despesa</option>
                            <option value="INCOME">💰 Receita</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>📂 Categoria</label>
                        <select id="category" required>
                            <option value="">Selecione uma categoria</option>
                        </select>
                    </div>
                </div>
                
                <div class="modal-buttons">
                    <button type="button" onclick="closeModal()" class="btn-secondary">Cancelar</button>
                    <button type="submit" class="btn-primary">💾 Salvar</button>
                </div>
            </form>
        </div>
    </div>
    
    <div id="toast" class="toast"></div>
    
    <script>
        // Categorias disponíveis
        const EXPENSE_CATEGORIES = [
            "Alimentação", "Transporte", "Lazer", "Moradia", "Saúde", 
            "Educação", "Vestuário", "Serviços", "Pet", "Presentes", 
            "Viagem", "Dívidas", "Outros"
        ];
        
        const INCOME_CATEGORIES = [
            "Salário", "Freelance", "Investimentos", "Presentes", 
            "Bônus", "Rendimentos", "Outros"
        ];
        
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => { toast.className = 'toast'; }, 3000);
        }
        
        function formatCurrency(value) {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
        }
        
        function formatDate(dateString) {
            return new Date(dateString).toLocaleDateString('pt-BR');
        }
        
        function getToday() {
            return new Date().toISOString().split('T')[0];
        }
        
        function getFirstDayOfMonth() {
            const today = new Date();
            return new Date(today.getFullYear(), today.getMonth(), 1).toISOString().split('T')[0];
        }
        
        function resetFilters() {
            document.getElementById('startDate').value = getFirstDayOfMonth();
            document.getElementById('endDate').value = getToday();
            loadTransactions();
        }
        
        function updateCategories() {
            const type = document.getElementById('type').value;
            const select = document.getElementById('category');
            const categories = type === 'EXPENSE' ? EXPENSE_CATEGORIES : INCOME_CATEGORIES;
            
            select.innerHTML = '<option value="">Selecione uma categoria</option>';
            categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                select.appendChild(option);
            });
        }
        
        async function loadTransactions() {
            const userId = localStorage.getItem('userId');
            if (!userId) { 
                window.location.href = 'login.html'; 
                return; 
            }
            
            let startDate = document.getElementById('startDate').value || getFirstDayOfMonth();
            let endDate = document.getElementById('endDate').value || getToday();
            
            try {
                console.log("Carregando transações para usuário:", userId);
                const response = await fetch(`/api/transactions?userId=${userId}&startDate=${startDate}&endDate=${endDate}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const transactions = await response.json();
                console.log("Transações recebidas:", transactions);
                
                const tbody = document.getElementById('transactionsList');
                
                if (!transactions || transactions.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="empty-message">📭 Nenhuma transação encontrada</td></tr>';
                    return;
                }
                
                tbody.innerHTML = transactions.map(t => `
                    <tr>
                        <td>${formatDate(t.transactionDate)}</td>
                        <td><strong>${escapeHtml(t.description)}</strong></td>
                        <td><span class="category-badge">${escapeHtml(t.category)}</span></td>
                        <td><span class="type-badge ${t.type === 'INCOME' ? 'income' : 'expense'}">${t.type === 'INCOME' ? '💰 Receita' : '💸 Despesa'}</span></td>
                        <td class="${t.type === 'INCOME' ? 'income-value' : 'expense-value'}">${formatCurrency(t.amount)}</td>
                        <td>
                            <button class="btn-icon edit" onclick="editTransaction(${t.id})">✏️</button>
                            <button class="btn-icon delete" onclick="deleteTransaction(${t.id})">🗑️</button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Erro ao carregar:', error);
                showToast('Erro ao carregar transações: ' + error.message, 'error');
            }
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function openModal() {
            document.getElementById('modalTitle').textContent = '➕ Nova transação';
            document.getElementById('transactionForm').reset();
            document.getElementById('transactionId').value = '';
            document.getElementById('transactionDate').value = getToday();
            updateCategories();
            document.getElementById('transactionModal').style.display = 'flex';
        }
        
        function closeModal() {
            document.getElementById('transactionModal').style.display = 'none';
        }
        
        async function editTransaction(id) {
            const userId = localStorage.getItem('userId');
            try {
                const response = await fetch(`/api/transactions?userId=${userId}&startDate=2000-01-01&endDate=2100-12-31`);
                const transactions = await response.json();
                const transaction = transactions.find(t => t.id === id);
                
                if (transaction) {
                    document.getElementById('modalTitle').textContent = '✏️ Editar transação';
                    document.getElementById('transactionId').value = transaction.id;
                    document.getElementById('description').value = transaction.description;
                    document.getElementById('amount').value = transaction.amount;
                    document.getElementById('type').value = transaction.type;
                    document.getElementById('transactionDate').value = transaction.transactionDate;
                    updateCategories();
                    setTimeout(() => { 
                        document.getElementById('category').value = transaction.category; 
                    }, 100);
                    document.getElementById('transactionModal').style.display = 'flex';
                }
            } catch (error) {
                showToast('Erro ao carregar transação', 'error');
            }
        }
        
        async function deleteTransaction(id) {
            if (!confirm('⚠️ Tem certeza que deseja excluir esta transação?')) return;
            
            const userId = localStorage.getItem('userId');
            try {
                const response = await fetch(`/api/transactions/${id}?userId=${userId}`, { 
                    method: 'DELETE' 
                });
                const result = await response.json();
                
                if (result.success) {
                    showToast('✅ Transação excluída!', 'success');
                    loadTransactions();
                } else {
                    showToast(result.error || 'Erro ao excluir', 'error');
                }
            } catch (error) {
                showToast('Erro ao excluir transação', 'error');
            }
        }
        
        document.getElementById('transactionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userId = localStorage.getItem('userId');
            if (!userId) {
                showToast('Usuário não logado', 'error');
                return;
            }
            
            const id = document.getElementById('transactionId').value;
            const transaction = {
                userId: parseInt(userId),
                description: document.getElementById('description').value,
                amount: parseFloat(document.getElementById('amount').value),
                type: document.getElementById('type').value,
                category: document.getElementById('category').value,
                transactionDate: document.getElementById('transactionDate').value
            };
            
            if (!transaction.category) {
                showToast('Selecione uma categoria', 'error');
                return;
            }
            
            const url = id ? `/api/transactions/${id}` : '/api/transactions';
            const method = id ? 'PUT' : 'POST';
            
            console.log("Enviando:", transaction);
            
            try {
                const response = await fetch(url, { 
                    method: method, 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(transaction) 
                });
                
                const result = await response.json();
                console.log("Resposta:", result);
                
                if (result.success) {
                    showToast(id ? '✅ Transação atualizada!' : '✅ Transação salva!', 'success');
                    closeModal();
                    loadTransactions();
                } else {
                    showToast(result.error || 'Erro ao salvar', 'error');
                }
            } catch (error) {
                console.error('Erro:', error);
                showToast('Erro ao salvar transação: ' + error.message, 'error');
            }
        });
        
        document.getElementById('userName').textContent = localStorage.getItem('userName') || 'Usuário';
        
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.clear();
            window.location.href = 'login.html';
        });
        
        document.getElementById('startDate').value = getFirstDayOfMonth();
        document.getElementById('endDate').value = getToday();
        
        window.onclick = function(event) {
            const modal = document.getElementById('transactionModal');
            if (event.target === modal) closeModal();
        };
        
        // Carregar transações ao iniciar
        loadTransactions();
    </script>
</body>
</html>
